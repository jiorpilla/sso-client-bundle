# Demo app for end-to-end testing against a local SSO.
# Requires the SSO stack (~/dev/sso, `make up`) to be running: this joins its network,
# reaches it at https://sso.local, and reuses its local certificates.
services:
  app1-php:
    image: sso-php
    working_dir: /app/demo
    volumes:
      - ../:/app
      - ${SSO_CERTS_DIR:-../../sso/docker/nginx/certs}:/certs:ro

  app1-nginx:
    image: nginx:1.28-alpine
    ports:
      - "8443:8443"
    volumes:
      - ../:/app:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSO_CERTS_DIR:-../../sso/docker/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - app1-php
    networks:
      default:
        # Lets the SSO reach https://app1.local:8443 server-to-server (back-channel logout)
        aliases:
          - app1.local

networks:
  default:
    name: sso_default
    external: true
